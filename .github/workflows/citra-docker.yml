# Citra Docker ke GHCR.
#
# VPS hanya 2 vCPU/2 GB dan mati dua kali (10 Oktober 2026) saat menjalankan
# `docker build` di mesinnya sendiri. Sejak workflow ini ada, VPS tidak pernah
# kompilasi lagi: build jalan di runner GitHub (gratis untuk repo publik),
# image masuk GHCR, VPS tinggal `docker pull` + `docker run`.
#
# Pemicu dibatasi berkas yang masuk image (paths), supaya push dokumen tidak
# membangun image sia-sia. Build manual lewat tombol Run workflow.
name: Citra Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
      - "next.config.ts"
      - "src/**"
      - "snapshot/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@v3

      - name: Masuk GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dua tag sekaligus: SHA untuk kembali ke versi persis (`docker run
      # ...:sha-abcdef1`), dan `stabil` untuk tarikan tanpa hafal SHA.
      # Jangan pernah pakai `latest`: tidak memberi jalan kembali.
      - name: Bangun dan dorong
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hilmiazmi/web-kesehatan:sha-${{ github.sha }}
            ghcr.io/hilmiazmi/web-kesehatan:stabil
          cache-from: type=gha
          cache-to: type=gha,mode=max
