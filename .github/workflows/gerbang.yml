# Gerbang kualitas. Satu berkas ini menjalankan urutan yang sama dengan yang
# biasa dijalankan manual sebelum menyatakan selesai.
#
# Rahasia tidak ada di sini, dan tidak boleh ditambah. Semua langkah berjalan
# pada mode snapshot: `DATABASE_URL` sengaja dibiarkan kosong sehingga server
# membaca berkas JSON di `snapshot/` dan tidak pernah menyentuh database
# sungguhan.
#
# Langkah yang butuh PostgreSQL sungguhan sengaja tidak dimasukkan. `cek:admin`
# jelas butuh itu, dan `cek:tulis` menyentuh database sungguhan. `cek:konten`
# juga, kalau `DATABASE_URL` diisi. Ketiganya masih bisa dijalankan manual di
# lokal lewat docker compose.
name: Gerbang

# Dipicu oleh setiap push dan setiap pull request, sesuai roadmap bagian 4
# butir 6: gerbang berjalan pada setiap push. Konsekuensinya branch yang sudah
# punya pull request akan diperiksa dua kali, satu untuk push dan satu untuk
# pull request. Rananya sengaja dipisah karena `github.ref` berbeda: push
# memakai refs/heads/nama-branch, pull request memakai refs/pull/angka/merge.
on: [push, pull_request]

# Izinkan hanya satu alur berjalan untuk satu ref. Push baru ke branch yang
# sama membatalkan pemeriksaan lama supaya antrean tidak menumpuk.
concurrency:
  group: gerbang-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Repo hanya perlu dibaca. Tidak ada langkah yang menulis ke GitHub.
permissions:
  contents: read

jobs:
  gerbang:
    name: Lint, tes, build
    runs-on: ubuntu-latest

    # Batas waktu enam menit. Build produksi pada repo ini selesai sekitar dua
    # menit, jadi angka ini memberi ruang tanpa membiarkan pemeriksaan
    # menggantung. Ditaruh di job, bukan di atas: `timeout-minutes` di level
    # workflow tidak valid dan membuat seluruh alur gagal sebelum mulai.
    timeout-minutes: 6

    env:
      # Aplikasi ini melayani zona WIB dan sebagian aturannya memakai tanggal
      # setempat mesin. Tanpa ini, runner GitHub yang berjalan dalam UTC
      # menghitung "hari ini" yang berbeda pada 00:00-06:59 WIB, dan dua tes
      # waktu gagal padahal lulus di mesin pengembang. Ini penanda sementara
      # sampai aturannya dihitung dari UTC eksplisit, bukan dari zona mesin.
      TZ: Asia/Jakarta
      # Kosong berarti mode snapshot. Jangan diisi dengan URL database mana pun,
      # dan jangan pakai secret repository untuk ini.
      DATABASE_URL: ""
      API_MODE: snapshot
      # `metadataBase` pada src/app/layout.tsx membaca ini. Nilai asalnya
      # http://localhost:3000 sudah cukup, karena yang diuji adalah build-nya.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang bun
        uses: oven-sh/setup-bun@v2
        with:
          # Versi dikunci di packageManager. Jangan pakai `bun-version: latest`,
          # karena angka itu ikut naik bila dependensi lain dinaikkan.
          bun-version: 1.4.2

      - name: Pasang dependensi
        # --frozen-lockfile menolak jalan bila bun.lock tidak cocok dengan
        # package.json. Tanpa itu, lockfile yang usang bisa lolos diam-diam.
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tes
        run: bun run test

      # Dua hambatan yang tidak terlihat oleh build maupun tes: snapshot yang
      # tidak sinkur dengan route handler, sehingga fallback diam-diam selalu
      # gagal tanpa pesan, dan teks rusak yang lolos ke halaman.
      #
      # `cek:konten` bukan "tidak butuh database", melainkan "butuh mode
      # snapshot". Di mode live ia ikut menghitung isi tabel seed lewat
      # PostgreSQL, dan di sini itu akan gagal. Karena `DATABASE_URL` di atas
      # dikosongkan, ia membaca berkas JSON dan tidak pernah membuka soket.
      - name: Snapshot dan route saling cocok
        run: bun run cek:konten

      - name: Audit teks
        run: bun run audit:teks

      # Build sekaligus typecheck. Typecheck berjalan di dalam
      # `next build`, jadi langkah terpisah tidak perlu.
      - name: Build produksi
        run: bun run build

      # Harus setelah build, karena yang diperiksa adalah HTML hasil
      # prerender di `.next/server/app`. Menggagalkan tiga hal sekaligus:
      # tautan yang menunjuk halaman tidak ada, halaman yang tidak pernah
      # ditautkan dari mana pun, dan halaman yang lupa masuk sitemap.
      #
      # Catatan urutan: langkah ini membaca `.next/server/app`, jadi tidak
      # butuh server, tidak butuh database, dan tidak butuh browser.
      - name: Kropl tautan dan kelengkapan sitemap
        run: bun run cek:tautan